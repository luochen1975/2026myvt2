name: Update IPTV

permissions:
  contents: write

on:
  schedule:
    - cron: '0 2,14 * * *'   # UTC 02:00 和 14:00，对应北京时间 10:00 和 22:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update
        run: python scripts/update_iptv.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: update iptv $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          )
