rules:
  # ==============================================
  # 前置清理
  # ==============================================
  - filter: '(?i)\s*(?:\[?hd\]?|高清|超清|标清).*'
    replace: ''
  - filter: '(?i)(?:CCTV|中央电视台|央视).*\d{4,}'
    action: reject

  # ==============================================
  # 其他类（靠前，避免被地方规则抢走）
  # ==============================================
  - filter: '(?i)^(?!.*(?:CCTV|央视|中央电视台)).*(广播|电台|radio|FM|之音|之声|伴音|调频|CRI).*'
    rename: ''
    group: '其他>广播'
  - filter: '(?i)^(?!.*(?:CCTV|央视|中央电视台)).*(合集|精选|DJ|歌曲|串烧|Beyond|电音|狂热|车载).*'
    rename: ''
    group: '其他>音乐'
  - filter: '(?i)^(?!.*(?:CCTV|央视|中央电视台)).*(NewTV|UTV|天府|咪视界|iHOT|黑莓|睛彩|咪咕).*'
    rename: ''
    group: '其他>NewTviHOT等'
  - filter: '(?i)^(?!.*(?:CCTV|央视|中央电视台)).*(影院|电影|CHC|家庭|华数|剧场|BesTV|轮播|求索).*'
    rename: ''
    group: '精彩'

  # ==============================================
  # 央视 CCTV1~17 + CGTN
  # ==============================================
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?1(?!\d)(?:[\s_-]*(?:台|套|综合|综合频道))?.*'
    rename: 'CCTV-1'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?2(?!\d)(?:[\s_-]*(?:台|套|财经|财经频道))?.*'
    rename: 'CCTV-2'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?3(?!\d)(?:[\s_-]*(?:台|套|综艺|综艺频道))?.*'
    rename: 'CCTV-3'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?4.*?(?:美洲|北美).*'
    rename: 'CCTV-4美洲'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?4.*?(?:欧洲).*'
    rename: 'CCTV-4欧洲'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?4.*?(?:亚洲).*'
    rename: 'CCTV-4亚洲'
    group: '央视'
  - filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?4[\s_-]*K.*'
    rename: 'CCTV-4K'
    group: '央视'
  - filter: '(?i)^(?:CCTV|中央电视台|央视)[\s_-]*0?4(?:[A-Z])?(?!\d).*$'
    rename: 'CCTV-4中文'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?5[\s_-]*(?:\+|plus|体育赛事).*'
    rename: 'CCTV-5+'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?5(?!\d).*'
    rename: 'CCTV-5'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?6(?!\d).*'
    rename: 'CCTV-6'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?7(?!\d).*'
    rename: 'CCTV-7'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?8(?!\d).*'
    rename: 'CCTV-8'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*0?9(?!\d).*'
    rename: 'CCTV-9'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*10(?!\d).*'
    rename: 'CCTV-10'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*11(?!\d).*'
    rename: 'CCTV-11'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*12(?!\d).*'
    rename: 'CCTV-12'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*13(?!\d).*'
    rename: 'CCTV-13'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*14(?!\d).*'
    rename: 'CCTV-14'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*15(?!\d).*'
    rename: 'CCTV-15'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*16(?!\d).*'
    rename: 'CCTV-16'
    group: '央视'
  - filter: '(?i).*(?:CCTV|中央电视台|央视)[\s_-]*17(?!\d).*'
    rename: 'CCTV-17'
    group: '央视'
  - filter: '(?i).*(?:CGTN)[\s_-]*法语.*'
    rename: 'CGTN-Français'
    group: '央视'
  - filter: '(?i).*(?:CGTN)[\s_-]*西班牙.*'
    rename: 'CGTN-Español'
    group: '央视'
  - filter: '(?i).*(?:CGTN)[\s_-]*俄语.*'
    rename: 'CGTN-Русский'
    group: '央视'
  - filter: '(?i).*(?:CGTN)[\s_-]*阿拉伯.*'
    rename: 'CGTN-العربية'
    group: '央视'
  - filter: '(?i).*(?:CGTN|中国国际电视台).*'
    rename: 'CGTN'
    group: '央视'
  - filter: '(?i)(?:CCTV[\s_-]*)?(?:央视)?[\s_-]*文化[\s_-]*精品'
    rename: 'CCTV文化精品'
    group: '央视'
  - filter: '(?i).*(?:CCTV|央视).*高尔夫|高网.*'
    rename: 'CCTV高尔夫·网球'
    group: '央视'
  - filter: '(?i).*(?:CETV|中国教育|中国气象|中国天气|中央新影).*'
    rename: ''
    group: '央视'

  # ==============================================
  # 卫视
  # ==============================================
  - filter: '(?i).*(?:北京|BTV)[\s_-]*卫视.*'
    rename: '北京卫视'
    group: '卫视'
  - filter: '(?i).*(?:上海|东方)[\s_-]*卫视.*'
    rename: '东方卫视'
    group: '卫视'
  - filter: '(?i).*(?:江苏)[\s_-]*卫视.*'
    rename: '江苏卫视'
