  - filter: '(?i).*(?:湖南)[\s_-]*卫视.*'
    rename: '湖南卫视'
    group: '卫视'
  - filter: '(?i).*(?:湖北)[\s_-]*卫视.*'
    rename: '湖北卫视'
    group: '卫视'
  - filter: '(?i).*(?:河南)[\s_-]*卫视.*'
    rename: '河南卫视'
    group: '卫视'
  - filter: '(?i).*(?:山东)[\s_-]*卫视.*'
    rename: '山东卫视'
    group: '卫视'
  - filter: '(?i).*(?:广东)[\s_-]*卫视.*'
    rename: '广东卫视'
    group: '卫视'
  - filter: '(?i).*(?:大湾区)[\s_-]*卫视.*'
    rename: '大湾区卫视'
    group: '卫视'
  - filter: '(?i).*(?:四川)[\s_-]*卫视.*'
    rename: '四川卫视'
    group: '卫视'
  - filter: '(?i).*(?:重庆)[\s_-]*卫视.*'
    rename: '重庆卫视'
    group: '卫视'
  - filter: '(?i).*(?:福建|东南)[\s_-]*卫视.*'
    rename: '东南卫视'
    group: '卫视'
  - filter: '(?i).*(?:厦门)[\s_-]*卫视.*'
    rename: '厦门卫视'
    group: '卫视'
  - filter: '(?i).*(?:江西)[\s_-]*卫视.*'
    rename: '江西卫视'
    group: '卫视'
  - filter: '(?i).*(?:辽宁)[\s_-]*卫视.*'
    rename: '辽宁卫视'
    group: '卫视'
  - filter: '(?i).*(?:黑龙江)[\s_-]*卫视.*'
    rename: '黑龙江卫视'
    group: '卫视'
  - filter: '(?i).*(?:吉林)[\s_-]*卫视.*'
    rename: '吉林卫视'
    group: '卫视'
  - filter: '(?i).*(?:河北)[\s_-]*卫视.*'
    rename: '河北卫视'
    group: '卫视'
  - filter: '(?i).*(?:山西)[\s_-]*卫视.*'
    rename: '山西卫视'
    group: '卫视'
  - filter: '(?i).*(?:内蒙古)[\s_-]*卫视.*'
    rename: '内蒙古卫视'
    group: '卫视'
  - filter: '(?i).*(?:广西)[\s_-]*卫视.*'
    rename: '广西卫视'
    group: '卫视'
  - filter: '(?i).*(?:贵州)[\s_-]*卫视.*'
    rename: '贵州卫视'
    group: '卫视'
  - filter: '(?i).*(?:云南)[\s_-]*卫视.*'
    rename: '云南卫视'
    group: '卫视'
  - filter: '(?i).*(?:西藏)[\s_-]*卫视.*'
    rename: '西藏卫视'
    group: '卫视'
  - filter: '(?i).*(?:陕西)[\s_-]*卫视.*'
    rename: '陕西卫视'
    group: '卫视'
  - filter: '(?i).*(?:甘肃)[\s_-]*卫视.*'
    rename: '甘肃卫视'
    group: '卫视'
  - filter: '(?i).*(?:青海)[\s_-]*卫视.*'
    rename: '青海卫视'
    group: '卫视'
  - filter: '(?i).*(?:宁夏)[\s_-]*卫视.*'
    rename: '宁夏卫视'
    group: '卫视'
  - filter: '(?i).*(?:新疆)[\s_-]*卫视.*'
    rename: '新疆卫视'
    group: '卫视'
  - filter: '(?i).*(?:深圳)[\s_-]*卫视.*'
    rename: '深圳卫视'
    group: '卫视'

  # ==============================================
  # 港澳台（繁简 + 你点名的频道）
  # ==============================================
  - filter: '(?i)(?:凤凰|TVB|东森|東森|中视|中視|华视|華視|民视|民視|中天|三立|astro|八大|八度|香港|翡翠|明珠台|TVB明珠|无线明珠|無線明珠|天映|千禧|Viu|Cinema|HOY|龙华|龍華|黄金华剧|黃金華劇|大爱|大愛|娱乐新闻|娛樂新聞|无线|無線|^NOW|RTHK|澳门|澳門|澳视|澳視|莲花|蓮花|纬来|緯來|公视|公視|台视|台視|年代|星卫|星衛|龙祥|龍祥|AXN|靖天|靖洋|TVBS|^CH[58u]|星空卫视|星空衛視|金光布袋|爆谷|星影|原住|镜新闻|鏡新聞|镜电视|鏡電視|DRAMA|FILEM|LAWAK|CERIA|TRAVEL|EZTV|优视|優視|Stingray|The\s*Pet|采昌|影迷数位|amc|CMusic|Taiwan|寰宇|非凡|台湾戏剧|台灣戲劇|EYE|美亚|美亞|博斯|爱尔达|愛爾達|ROCK|JET|ELta|昆仑|長江|长江|HUB|MOMO|HBO|邵氏|原视|原視|Trace\s*Urban|中旺|汉天|漢天|KTSF|新视觉|新視覺|Red\s*Bull|红牛|智林|Hope|Horse|ZOO\s*MOO|半岛新闻|半島新聞|大立|番薯|港台\s*3[12]|好消息|华艺|華藝|新唐人|NTD)'
    rename: ''
    group: '港澳台'
  - filter: '(?i).*(?:凤凰卫视中文|凤凰中文).*'
    rename: '凤凰中文台'
    group: '港澳台'
  - filter: '(?i).*(?:凤凰卫视资讯|凤凰资讯).*'
    rename: '凤凰资讯台'
    group: '港澳台'
  - filter: '(?i).*(?:凤凰卫视香港|凤凰香港).*'
    rename: '凤凰香港台'
    group: '港澳台'
  - filter: '(?i).*astro.*'
    rename: ''
    group: '港澳台'
  - filter: '(?i).*(?:翡翠台|tvb翡翠).*'
    rename: '翡翠台'
    group: '港澳台'
  - filter: '(?i)^(?!.*杭州).*(?:明珠台|tvb[\s_-]*明珠|无线明珠|無線明珠).*$'
    rename: '明珠台'
    group: '港澳台'
  - filter: '(?i).*(?:香港卫视|香港衛視).*'
    rename: '香港卫视'
    group: '港澳台'
  - filter: '(?i).*(?:澳亚卫视|澳亞衛視).*'
    rename: '澳亚卫视'
    group: '港澳台'
  - filter: '(?i).*(?:星空卫视|星空衛視).*'
    rename: '星空卫视'
    group: '港澳台'
  - filter: '(?i).*TVBS.*'
    rename: 'TVBS'
    group: '港澳台'
  - filter: '(?i).*(?:中天).*'
    rename: '中天亚洲台'
    group: '港澳台'
  - filter: '(?i).*(?:三立|SET).*'
    rename: '三立国际台'
    group: '港澳台'
  - filter: '(?i).*(?:东森|東森).*'
    rename: ''
    group: '港澳台'
  - filter: '(?i).*(?:新唐人|NTD).*'
    rename: '新唐人'
    group: '港澳台'
  - filter: '(?i).*(?:汉天|漢天).*'
    rename: '汉天卫视'
    group: '港澳台'
  - filter: '(?i).*(?:港台\s*31|RTHK\s*31).*'
    rename: '港台31'
    group: '港澳台'
  - filter: '(?i).*(?:港台\s*32|RTHK\s*32).*'
    rename: '港台32'
    group: '港澳台'
  - filter: '(?i).*(?:大立).*'
    rename: '大立电视'
    group: '港澳台'
  - filter: '(?i).*(?:好消息).*'
    rename: '好消息'
    group: '港澳台'
  - filter: '(?i).*(?:华艺|華藝).*'
    rename: '华艺中文'
    group: '港澳台'
  - filter: '(?i).*(?:番薯).*'
    rename: '番薯'
    group: '港澳台'
  - filter: '(?i).*(?:半岛新闻|半島新聞).*'
    rename: '半岛新闻'
    group: '港澳台'

  # ==============================================
  # 地方>浙江
  # ==============================================
  - filter: '(?i).*杭州.*明珠.*'
    rename: '杭州明珠'
    group: '地方>浙江'
  - filter: '(?i).*(?:浙江新闻|ZTV新闻).*'
    rename: '浙江新闻'
    group: '地方>浙江'
  - filter: '(?i).*(?:钱江都市|ZTV钱江|浙江钱江).*'
    rename: '浙江钱江都市'
    group: '地方>浙江'
  - filter: '(?i).*(?:浙江经视|ZTV经视|浙江经济生活).*'
    rename: '浙江经济生活'
    group: '地方>浙江'
  - filter: '(?i).*(?:浙江教科|教科影视).*'
    rename: '浙江教科影视'
    group: '地方>浙江'
  - filter: '(?i).*(?:浙江民生|民生休闲).*'
    rename: '浙江民生休闲'
    group: '地方>浙江'
  - filter: '(?i).*(?:浙江少儿|ZTV少儿).*'
    rename: '浙江少儿'
    group: '地方>浙江'
  - filter: '(?i).*(?:之江纪录|之江记录).*'
    rename: '之江纪录'
    group: '地方>浙江'
  - filter: '(?i).*(?:好易购).*'
    rename: '好易购'
    group: '地方>浙江'
  - filter: '(?i).*(?:宁波新闻综合|NBTV\s*1|宁波一套|宁波1|宁波TV1).*'
    rename: '宁波新闻综合'
    group: '地方>浙江'
  - filter: '(?i).*(?:宁波经济生活|NBTV\s*2|宁波二套|宁波2|宁波TV2).*'
    rename: '宁波经济生活'
    group: '地方>浙江'
  - filter: '(?i).*(?:宁波都市文体|NBTV\s*3|宁波三套|宁波3|宁波TV3|宁波文体).*'
    rename: '宁波都市文体'
    group: '地方>浙江'
  - filter: '(?i).*(?:宁波影视剧|NBTV\s*4|宁波四套|宁波4|宁波TV4|宁波影视).*'
    rename: '宁波影视剧'
    group: '地方>浙江'
  - filter: '(?i).*(?:宁波少儿|NBTV\s*5|宁波五套|宁波TV5).*'
    rename: '宁波少儿'
    group: '地方>浙江'
  - filter: '(?i).*(?:鄞州|海曙|江北|北仑|镇海|余姚|慈溪|象山|宁海).*(?:台|新闻|综合)?'
    rename: ''
    group: '地方2>浙江县市区'
  - filter: '(?i).*(?:杭州综合|杭州一套|HZTV\s*1|杭州1).*'
    rename: '杭州综合'
    group: '地方>浙江'
  - filter: '(?i).*(?:杭州影视|杭州4).*'
    rename: '杭州影视'
    group: '地方>浙江'
  - filter: '(?i).*(?:杭州青少|亚运频道|杭州5).*'
    rename: '杭州青少体育'
    group: '地方>浙江'
  - filter: '(?i).*(?:杭州文化休闲|杭州生活|杭州3).*'
    rename: '杭州文化休闲'
    group: '地方>浙江'
  - filter: '(?i).*(?:温州新闻综合|温州一套).*'
    rename: '温州新闻综合'
    group: '地方>浙江'
  - filter: '(?i).*(?:温州都市生活|温州公共|瓯江先锋).*'
    rename: ''
    group: '地方>浙江'
  - filter: '(?i).*(?:绍兴新闻综合|绍兴公共|绍兴文化影视).*'
    rename: ''
    group: '地方>浙江'
  - filter: '(?i).*(?:金华新闻综合|金华公共|金华教育).*'
    rename: ''
    group: '地方>浙江'
  - filter: '(?i).*(?:台州新闻综合|台州公共|台州文化).*'
    rename: ''
    group: '地方>浙江'
  - filter: '(?i).*(?:嘉兴新闻综合|嘉兴公共|嘉兴文化).*'
    rename: ''
    group: '地方>浙江'
  - filter: '(?i).*(?:湖州新闻综合|湖州公共|湖州新起点).*'
    rename: ''
    group: '地方>浙江'
  - filter: '(?i).*(?:衢州新闻综合|衢州公共).*'
